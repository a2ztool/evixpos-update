name: Auto Deploy EvixPOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
server: ${{ secrets.ftp.evixpos.com }}
username: ${{ secrets.u921789779.evixpos }}
password: ${{ secrets.Rishi@2025#baba }}
          local-dir: dist/
          server-dir: public_html/
